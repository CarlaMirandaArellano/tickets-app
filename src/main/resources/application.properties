spring.application.name=tickets-app
server.port=8080

# ---------- EFS ----------
# Dentro del contenedor el EFS se monta en /app/efs (docker run -v /mnt/efs:/app/efs).
# En local se usa la carpeta ./efs
app.efs.base-path=${EFS_PATH:./efs}

# ---------- S3 ----------
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:us-east-1}
# Si es true, al generar o modificar un ticket se sube a S3 automáticamente
app.s3.auto-upload=${S3_AUTO_UPLOAD:true}

# ---------- Base de datos (H2 en archivo, guardada en el EFS) ----------
spring.datasource.url=jdbc:h2:file:${EFS_PATH:./efs}/db/ticketsdb;FILE_LOCK=NO
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Actuator (lo usa el pipeline para verificar el despliegue) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Respuestas JSON con fechas legibles
spring.jackson.serialization.write-dates-as-timestamps=false
